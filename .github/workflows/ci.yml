name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          cp "gnome-shell/smbact@giglabo.com/extension.js" "$RUNNER_TEMP/extension.mjs"
          node --check "$RUNNER_TEMP/extension.mjs"
          python3 -m py_compile scripts/call.py
          python3 -c "import json; json.load(open('gnome-shell/smbact@giglabo.com/metadata.json'))"
      - name: Pack
        run: scripts/pack.sh
      - uses: actions/upload-artifact@v4
        with:
          name: smbact-shell-gnome
          path: dist/*.zip
